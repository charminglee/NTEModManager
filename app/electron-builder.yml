appId: com.nuoyan.nte-mod-manager
productName: NteModManager
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: ../img/bg
    to: category-bg
  - from: ../img/nte-mod-manager.ico
    to: nte-mod-manager.ico
  # 内置傻瓜打包器，运行时从应用资源目录读取；只排除运行时生成内容。
  - from: ../傻瓜打包器
    to: packager
    filter:
      - "**/*"
      - "!xg/HT/Content/**"
      - "!LastImportFolder.txt"
      - "!temp_base.pak"
# Python 资源(解释器/识别脚本/pt 模型)不打包:运行时从程序目录旁的 python/
# 或项目根的 python/ 解析(见 config.ts pythonAssetsDir),部署时把 python/ 目录
# 放到 exe 旁边即可
asar: true
# 无原生模块(依赖只有 @radix-ui/react-slider、@ybouane/liquidglass、iconv-lite,均纯 JS),
# 跳过 @electron/rebuild 的原生依赖重建;将来引入 .node 原生模块时删掉这行。
npmRebuild: false
# Electron 压缩包走 npmmirror:与 install-electron 的下载 URL 同源,才能命中
# %LOCALAPPDATA%\electron\Cache 的共享缓存(缓存键=下载 URL 的哈希,镜像不同则永远 miss)
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: ../img/nte-mod-manager.ico
  target:
    - target: dir
      arch:
        - x64
