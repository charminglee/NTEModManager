appId: com.nuoyan.nte-mod-manager
productName: NteModManager
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: ../img/bg
    to: category-bg
  - from: ../img/nte-mod-manager.ico
    to: nte-mod-manager.ico
# Python 资源(解释器/识别脚本/pt 模型)不打包:运行时从程序目录旁的 python/
# 或项目根的 python/ 解析(见 config.ts pythonAssetsDir),部署时把 python/ 目录
# 放到 exe 旁边即可
asar: true
# Electron 压缩包走 npmmirror:与 install-electron 的下载 URL 同源,才能命中
# %LOCALAPPDATA%\electron\Cache 的共享缓存(缓存键=下载 URL 的哈希,镜像不同则永远 miss)
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: ../img/nte-mod-manager.ico
  target:
    - target: dir
      arch:
        - x64
