# 无界面背景图服务(NteModBgServer.exe):仅主进程,无 preload/renderer。
# 与主程序共用 ~/.ntemm/NteModManager.ini(缺省自动命中,分开放置用 --config=<路径> 指回);
# 输出目录独立于主程序的 dist,两者产物可共存。
appId: com.nuoyan.nte-mod-bg-server
productName: NteModBgServer
directories:
  output: dist-bg-server
# 服务代码只依赖 Electron 与 Node 内置模块,asar 无需携带 node_modules
files:
  - out/bg-server/**
  - '!node_modules/**'
# 打包入口改为服务主进程(package.json 的 main 仍指向主程序的 out/main/index.js)
extraMetadata:
  main: ./out/bg-server/index.js
extraResources:
  # 视觉识别(Python 桥)资源:脚本、姿态模型与方向模型(与主程序一致)
  - from: ../python/visual_region_detector.py
    to: python/visual_region_detector.py
  - from: ../yolo26x-pose.pt
    to: python/model-cache/yolo26x-pose.pt
  - from: ../training/orientation/checkpoints/weighted_unfrozen/best.pt
    to: python/orientation-model/best.pt
asar: true
# Electron 压缩包走 npmmirror:与 install-electron 的下载 URL 同源,才能命中共享缓存
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: ../img/nte-mod-manager.ico
  target:
    - target: dir
      arch:
        - x64
